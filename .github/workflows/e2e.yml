name: End-to-end (Windows)

# Real game servers on a real Windows machine: create → download → start → ready → console command →
# player action → live backup → graceful stop → restore (with safety backup) → start again → stop.
on:
  workflow_dispatch:
    inputs:
      games:
        description: 'Games to test (JSON list)'
        default: '["minecraft-java vanilla","minecraft-java paper","minecraft-java fabric","valheim","palworld","terraria"]'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install ziglang && sudo apt-get update -qq && sudo apt-get install -y -qq nsis && ./build.sh && makensis -V2 installer/outpost.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: |
            dist/Outpost.exe
            dist/Outpost-Setup.exe

  selftest:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: exe
      - name: Self test
        shell: pwsh
        run: |
          $p = Start-Process .\Outpost.exe -ArgumentList '--data','D:\op','--cli','selftest' -NoNewWindow -PassThru -Wait -RedirectStandardOutput out.txt
          Get-Content out.txt
          exit $p.ExitCode

  installer:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: exe
      - name: Install, run, uninstall (silent)
        shell: pwsh
        run: |
          $p = Start-Process .\Outpost-Setup.exe -ArgumentList '/S' -PassThru; $p.WaitForExit()
          $exe = "$env:LOCALAPPDATA\Programs\Outpost\Outpost.exe"
          if (-not (Test-Path $exe)) { throw "not installed" }
          $k = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Outpost'
          Write-Host "Installed $($k.DisplayVersion) to $($k.InstallLocation)"
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Outpost.lnk")) { throw "no Start menu shortcut" }
          $p = Start-Process $exe -ArgumentList '--cli','templates' -NoNewWindow -PassThru -RedirectStandardOutput t.txt; $p.WaitForExit()
          Get-Content t.txt
          if ((Get-Content t.txt).Count -lt 12) { throw "templates missing" }
          $p = Start-Process "$env:LOCALAPPDATA\Programs\Outpost\uninstall.exe" -ArgumentList '/S' -PassThru; $p.WaitForExit()
          Start-Sleep 3
          if (Test-Path $exe) { throw "not uninstalled" }
          Write-Host "Install and uninstall OK"

  game:
    needs: selftest
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(github.event.inputs.games) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: exe
      - name: ${{ matrix.game }}
        shell: pwsh
        run: |
          $args = @('--data','D:\op','--cli','e2e') + ('${{ matrix.game }}' -split ' ') + @('--timeout','1200')
          $p = Start-Process .\Outpost.exe -ArgumentList $args -NoNewWindow -PassThru -RedirectStandardOutput out.txt
          $seen = 0
          while (-not $p.HasExited) {
            Start-Sleep 5
            $lines = @(Get-Content out.txt -ErrorAction SilentlyContinue)
            if ($lines.Count -gt $seen) { $lines[$seen..($lines.Count-1)] | ForEach-Object { Write-Host $_ }; $seen = $lines.Count }
          }
          $lines = @(Get-Content out.txt -ErrorAction SilentlyContinue)
          if ($lines.Count -gt $seen) { $lines[$seen..($lines.Count-1)] | ForEach-Object { Write-Host $_ } }
          exit $p.ExitCode
      - name: Logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force logs | Out-Null
          Copy-Item D:\op\outpost.log logs\ -ErrorAction SilentlyContinue
          Get-ChildItem D:\op\servers -Recurse -Include console.log,crash-*.log,server.json,state.json -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item $_.FullName ("logs\" + $_.Directory.Parent.Name + "-" + $_.Name) -ErrorAction SilentlyContinue }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ strategy.job-index }}
          path: logs
